<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    {% include header.html %}
    
    {% if page.hero_image %}
    <div class="hero-image" style="background-image: url('{{ page.hero_image | relative_url }}');">
        <div class="hero-overlay">
            <div class="container">
                <h1 class="hero-title">{{ page.hero_title | default: site.title }}</h1>
                <p class="hero-subtitle">{{ page.hero_subtitle | default: site.description }}</p>
            </div>
        </div>
    </div>
    {% endif %}
    
    <main>
        {{ content }}
    </main>

    {% include footer.html %}
</body>
</html>
