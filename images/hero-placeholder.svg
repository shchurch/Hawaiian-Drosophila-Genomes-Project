<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 500">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="500" fill="url(#heroGradient)"/>
  
  <!-- Decorative circles representing Drosophila -->
  <circle cx="200" cy="100" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="400" cy="350" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1600" cy="150" r="50" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1400" cy="400" r="45" fill="rgba(255,255,255,0.09)"/>
  <circle cx="800" cy="80" r="35" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="420" r="55" fill="rgba(255,255,255,0.08)"/>
  
  <!-- Small decorative dots -->
  <circle cx="600" cy="200" r="15" fill="rgba(255,255,255,0.15)"/>
  <circle cx="1200" cy="250" r="20" fill="rgba(255,255,255,0.12)"/>
  <circle cx="300" cy="450" r="18" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1700" cy="350" r="22" fill="rgba(255,255,255,0.13)"/>
  
  <text x="960" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" opacity="0.3">Hawaiian Drosophila</text>
</svg>
